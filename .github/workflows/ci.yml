# Batman Lab — CI/CD Pipeline
# Runs on every push and pull request
# Tests both repos, lints code, checks types

name: Batman Lab CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint + Type Check
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Ruff lint (Batman)
        run: ruff check batman_flow_engine/ --select E,F,W --ignore E501

      - name: Ruff lint (Nightwing)
        run: ruff check nightwing_agent/ --select E,F,W --ignore E501

      - name: Type check critical modules
        run: |
          mypy batman_flow_engine/core/gordon.py --ignore-missing-imports --no-error-summary || true
          mypy batman_flow_engine/core/harvey.py --ignore-missing-imports --no-error-summary || true
          mypy batman_flow_engine/core/lucius.py --ignore-missing-imports --no-error-summary || true

  # ─────────────────────────────────────────────
  # Job 2: Batman Tests (228+)
  # ─────────────────────────────────────────────
  test-batman:
    name: Batman Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd batman_flow_engine
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Create storage directories
        run: |
          cd batman_flow_engine
          mkdir -p storage/reports storage/logs

      - name: Run Batman tests
        run: |
          cd batman_flow_engine
          python -m pytest tests/ -q --timeout=30
        timeout-minutes: 5

  # ─────────────────────────────────────────────
  # Job 3: Nightwing Tests (155+)
  # ─────────────────────────────────────────────
  test-nightwing:
    name: Nightwing Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd nightwing_agent
          pip install pyyaml pytest pytest-timeout

      - name: Create storage directories
        run: |
          cd nightwing_agent
          mkdir -p storage/logs storage/ledger

      - name: Run Nightwing tests
        run: |
          cd nightwing_agent
          python -m pytest tests/ -q --timeout=30
        timeout-minutes: 5

  # ─────────────────────────────────────────────
  # Job 4: Security Scan
  # ─────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          echo "Scanning for hardcoded secrets..."
          if grep -rn "api_key\s*=\s*['\"]" batman_flow_engine/ nightwing_agent/ --include="*.py" | grep -v "test_" | grep -v "#"; then
            echo "⚠️  Possible hardcoded API keys found!"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Check for .env files committed
        run: |
          if [ -f batman_flow_engine/.env ] || [ -f nightwing_agent/.env ]; then
            echo "⚠️  .env file found in repo!"
            exit 1
          fi
          echo "✅ No .env files in repo"

  # ─────────────────────────────────────────────
  # Job 5: Build Verification
  # ─────────────────────────────────────────────
  build:
    name: Build & Import Check
    runs-on: ubuntu-latest
    needs: [test-batman, test-nightwing]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install all dependencies
        run: |
          cd batman_flow_engine
          pip install -r requirements.txt

      - name: Verify all scanners import correctly
        run: |
          cd batman_flow_engine
          python -c "
          from core.scanner_cross_exchange import scan_cross_exchange
          from core.scanner_basis import scan_basis
          from core.p2p_latam import p2p_premium_analysis
          from core.scanner_multi_exchange import scan_multi_exchange
          from core.scanner_funding_rate import scan_funding_rates
          from core.scanner_p2p_cross_currency import scan_cross_currency
          from core.scanner_p2p_merchant import scan_merchant_spread
          from core.scanner_stablecoin_depeg import scan_stablecoin_depeg
          from core.scanner_cross_platform_mxn import scan_cross_platform_mxn
          from core.scanner_dex import scan_dex_cex
          from core.scanner_futures_futures import scan_futures_futures
          print('✅ All 11 scanners import successfully')
          "

      - name: Verify support modules
        run: |
          cd batman_flow_engine
          python -c "
          from core.alfred import run_quality_check
          from core.harvey import ingest_opportunities
          from core.spread_tracker import get_lifetime_stats
          from core.pattern_analyzer import analyze_patterns
          from core.network_status import full_network_check
          print('✅ All support modules import successfully')
          "
